<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ratna Pearl Weddings</title>

  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- React + ReactDOM -->
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>

  <!-- Babel (lets us write JSX directly in the browser, no build step) -->
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <!-- Google Fonts matching our design system -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Libre+Bodoni:ital@0;1&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">

  <!-- Design tokens: colors, fonts (see styles/tokens.js) -->
  <script src="styles/tokens.js"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: designTokens.colors,
          fontFamily: designTokens.fontFamily,
        },
      },
    };
  </script>

  <!-- CSS custom properties + any hand-written styles -->
  <link rel="stylesheet" href="styles/tokens.css">
</head>
<body class="bg-ivory">
  <div id="root"></div>

  <!-- Components (order matters: load before app.js which uses them) -->
  <script type="text/babel" src="components/Badge.js"></script>
  <script type="text/babel" src="components/Button.js"></script>
  <script type="text/babel" src="components/Avatar.js"></script>
  <script type="text/babel" src="components/Input.js"></script>
  <script type="text/babel" src="components/TopNav.js"></script>

  <!-- Pages -->
  <script type="text/babel" src="pages/LandingPage.js"></script>
  <script type="text/babel" src="pages/OnboardingPage.js"></script>
  <script type="text/babel" src="pages/HomePage.js"></script>
  <script type="text/babel" src="pages/DateVenuePage.js"></script>
  <script type="text/babel" src="pages/VendorMarketplacePage.js"></script>
  <script type="text/babel" src="pages/BudgetTrackerPage.js"></script>
  <script type="text/babel" src="pages/DesignStudioPage.js"></script>
  <script type="text/babel" src="pages/GuestsPage.js"></script>
  <script type="text/babel" src="pages/TimelinePage.js"></script>

  <!-- Main app -->
  <script type="text/babel" src="app.js"></script>
</body>
</html>
